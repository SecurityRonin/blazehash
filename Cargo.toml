[workspace]
members = ["core"]
resolver = "2"

# Single source of truth for the hash-crate versions shared between the lean
# `blazehash-core` engine and the full `blazehash` app (DRY): declare each once
# here, members write `<dep>.workspace = true`.
[workspace.dependencies]
anyhow = "1"
# Output sanitization: RFC 4180 CSV quoting + spreadsheet formula guard.
jsonguard = "0.2"
digest = "0.10"
hex = "0.4"
blake3 = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
md-5 = "0.10"
tiger = "0.2"
whirlpool = "0.10"
blake2 = "0.10"
sm3 = "0.4"
streebog = "0.10"
ripemd = "0.1"
tiny-keccak = { version = "2", features = ["k12"] }
crc = "3"
crc32c = "0.6"
adler2 = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tlsh2 = { version = "0.4", features = ["diff"] }

# Paranoid Gatekeeper lints (fleet standard) — every member inherits via
# `[lints] workspace = true`. These crates parse untrusted input: never panic,
# never read out of bounds, never trust a length field.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }

[package]
name = "blazehash"
version = "0.2.6"
edition = "2021"
rust-version = "1.88"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Forensic file hasher — hashdeep for the modern era, BLAKE3 by default"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/blazehash"
homepage = "https://github.com/SecurityRonin/blazehash"
documentation = "https://docs.rs/blazehash"
readme = "README.md"
keywords = ["hash", "forensics", "blake3", "hashdeep", "dfir"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["target/", ".github/", ".serena/", "docs/", "wix/", "tests/data/", ".pre-commit-config.yaml", "renovate.json", "PACKAGING.md", "Makefile"]

[[bin]]
name = "blazehash"
path = "src/main.rs"

[lib]
name = "blazehash"
path = "src/lib.rs"

[dependencies]
blazehash-core = { version = "0.2.4", path = "core" }
anyhow = { workspace = true }
base64 = "0.22"
blake3 = { workspace = true }
clap = { version = "4", features = ["derive"] }
digest = { workspace = true }
hex = { workspace = true }
jsonguard = { workspace = true }
md-5 = { workspace = true }
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
tiger = { workspace = true }
tlsh2 = { workspace = true }
walkdir = "2"
whirlpool = { workspace = true }
xxhash-rust = { workspace = true }
crc32c = { workspace = true }
crc = { workspace = true }
blake2 = { workspace = true }
sm3 = { workspace = true }
streebog = { workspace = true }
ripemd = { workspace = true }
tiny-keccak = { workspace = true }
adler2 = { workspace = true }
# nilsimsa = "0.2"  # requires nightly: uses #![feature()] — skipped
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
argon2 = "0.5"
rpassword = "6"
ewf = { version = "0.4", optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
toml = "0.8"
dirs = "5"
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
bloomfilter = { version = "1", optional = true, features = ["serde"] }
yara-x = { version = "~1.7", optional = true }
minijinja = { version = "2", optional = true }
parquet = { version = "54", optional = true }
arrow = { version = "54", optional = true }
oci-distribution = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
# Pure-Rust, no-C-FFI ZIP reader (read-only). Test fixtures still write via the
# third-party `zip` dev-dependency below (zip-forensic-core has no writer).
zip-forensic-core = { version = "0.1", optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
notify = "6"
ureq = { version = "2", features = ["json"] }
bincode = "1"
indicatif = "0.18"
clap_complete = "4"
clap_mangen = "0.2"
uuid = { version = "1", features = ["v5"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tempfile = "3"
# >=1.10505.0 (bundles DuckDB 1.5.5): earlier bundled fmt used
# stdext::checked_array_iterator, removed in MSVC 14.51 -> Windows CI build break.
# DuckDB PR #23261/#23239 dropped that usage; 1.5.5 is the first release with the fix.
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
ml-dsa = "0.1.0-rc.8"
signature = "2"
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
regex = "1"
# Scoped to forensically-relevant evidence-transfer targets — the stores DFIR
# collectors (Velociraptor, KAPE) read case evidence from and write collections
# back to. Native DB/KV engines, caches, dev/ML/CI-cache, decentralized and
# consumer-drive backends are intentionally excluded (see ADR-0010).
opendal = { version = "0.55.0", optional = true, features = [
    # Cloud object storage
    "services-s3",          # AWS S3, MinIO, R2, Wasabi, Backblaze B2 (S3-compat)
    "services-gcs",         # Google Cloud Storage
    "services-azblob",      # Azure Blob Storage
    "services-azdls",       # Azure Data Lake Storage Gen2
    "services-azfile",      # Azure Files
    "services-b2",          # Backblaze B2 (native API)
    "services-cos",         # Tencent Cloud COS
    "services-obs",         # Huawei Cloud OBS
    "services-oss",         # Alibaba Cloud OSS
    "services-swift",       # OpenStack Swift
    # Cloud drive (the one drive with dedicated wiring in src/remote/gdrive/)
    "services-gdrive",      # Google Drive
    # Hadoop
    "services-webhdfs",     # WebHDFS REST (no JVM needed)
    "services-hdfs-native", # HDFS pure-Rust native client (no Java/libhdfs required)
    # SQL (sqlx, pure Rust)
    "services-mysql",       # MySQL / MariaDB
    "services-postgresql",  # PostgreSQL (README-advertised)
    "services-sqlite",      # SQLite
    # Filesystem / protocol
    "services-fs",
    "services-http",
    "services-webdav",
    "services-memory",      # in-memory (useful for testing + pipeline)
    # services-sftp intentionally omitted: openssh Rust crate is Unix-only.
    # SFTP is handled via ssh2 (libssh2 vendored, cross-platform) in src/remote/sftp.rs.
    # services-ftp intentionally omitted: async-tls/tokio-rustls conflict.
    # FTP/FTPS is handled via suppaftp (blocking + rustls) instead.
    "blocking",
] }

# FTP/FTPS: blocking suppaftp with rustls (avoids opendal services-ftp async-tls conflict)
suppaftp = { version = "6", default-features = false, features = ["rustls"], optional = true }
# SFTP: cross-platform ssh2 (libssh2 vendored — no openssh Rust crate, no Unix-only deps)
ssh2 = { version = "0.9", features = ["vendored-openssl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }

[features]
# `remote` (opendal cloud/object-storage backends) is a heavy, rarely-needed
# subsystem that drags in a vulnerable DNS (hickory) + quick-xml transitive tree.
# Per the fleet "batteries-included EXCEPT a genuinely-optional heavy subsystem
# MAY be a named non-default feature" rule, it is opt-in: build with
# `--features remote` (release binaries enable it). The default build — and
# therefore `cargo deny` — stays opendal-free.
default = ["forensic-image", "gpu", "sqlite", "parquet-output", "duckdb-output", "pq", "qr", "archive"]
forensic-image = ["dep:ewf"]
gpu = ["dep:wgpu", "dep:pollster"]
sqlite = ["dep:rusqlite"]
hashdb = ["dep:bloomfilter", "sqlite"]
yara    = ["dep:yara-x"]
report  = ["dep:minijinja"]
parquet-output = ["dep:parquet", "dep:arrow"]
docker  = ["dep:oci-distribution", "dep:flate2", "dep:tar", "dep:tokio"]
archive = ["dep:zip-forensic-core", "dep:flate2", "dep:tar"]
duckdb-output = ["dep:duckdb"]
tui = ["dep:ratatui", "dep:crossterm"]
ots = []
pq  = []
qr  = ["dep:qrcode", "dep:image"]
remote = ["dep:opendal", "dep:tokio", "dep:suppaftp", "dep:ssh2"]

[package.metadata.deb]
maintainer = "SecurityRonin <security-ronin@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = """\
blazehash is a forensic file hasher and drop-in superset of hashdeep. \
It defaults to BLAKE3 for speed, supports 8 hash algorithms \
(BLAKE3, SHA-256, SHA-512, SHA3-256, SHA-1, MD5, Tiger, Whirlpool), \
and provides multithreaded parallel hashing with memory-mapped I/O. \
Features include audit mode, piecewise hashing, resume support, \
and CSV/JSON/JSONL output formats."""
assets = [
    ["target/release/blazehash", "usr/bin/", "755"],
]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
# Third-party zip kept ONLY to write test-fixture archives (zip-forensic-core is
# read-only). default-features=false + deflate keeps this dev-dep C-FFI-free.
zip = { version = "2", default-features = false, features = ["deflate"] }

