[package]
name = "blazehash"
version = "0.2.4"
edition = "2021"
rust-version = "1.88"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Forensic file hasher — hashdeep for the modern era, BLAKE3 by default"
license = "MIT"
repository = "https://github.com/SecurityRonin/blazehash"
homepage = "https://github.com/SecurityRonin/blazehash"
documentation = "https://docs.rs/blazehash"
readme = "README.md"
keywords = ["hash", "forensics", "blake3", "hashdeep", "dfir"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["target/", ".github/", ".serena/", "docs/", "wix/", "tests/data/", ".pre-commit-config.yaml", "renovate.json", "PACKAGING.md", "Makefile"]

[[bin]]
name = "blazehash"
path = "src/main.rs"

[lib]
name = "blazehash"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
digest = "0.10"
hex = "0.4"
md-5 = "0.10"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
tiger = "0.2"
tlsh2 = { version = "0.4", features = ["diff"] }
walkdir = "2"
whirlpool = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32c = "0.6"
crc = "3"
blake2 = "0.10"
sm3 = "0.4"
streebog = "0.10"
ripemd = "0.1"
tiny-keccak = { version = "2", features = ["k12"] }
adler = "1"
# nilsimsa = "0.2"  # requires nightly: uses #![feature()] — skipped
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
argon2 = "0.5"
rpassword = "6"
ewf = { version = "0.2", optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "5", optional = true }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
bloomfilter = { version = "1", optional = true, features = ["serde"] }
yara-x = { version = "0.9", optional = true }
forensicnomicon = { path = "../forensicnomicon", optional = true }
minijinja = { version = "2", optional = true }
parquet = { version = "54", optional = true }
arrow = { version = "54", optional = true }
oci-distribution = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
notify = "6"
ureq = { version = "2", features = ["json"] }
bincode = "1"
indicatif = "0.17"
clap_complete = "4"
clap_mangen = "0.2"
uuid = { version = "1", features = ["v5"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tempfile = "3"
duckdb = { version = "1.4.4", features = ["bundled"], optional = true }
ml-dsa = "0.1.0-rc.8"
signature = "2"
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
regex = "1"
opendal = { version = "0.55.0", optional = true, features = [
    # Cloud object storage
    "services-s3",          # AWS S3, MinIO, R2, Wasabi, Backblaze B2 (S3-compat)
    "services-gcs",         # Google Cloud Storage
    "services-azblob",      # Azure Blob Storage
    "services-azdls",       # Azure Data Lake Storage Gen2
    "services-azfile",      # Azure Files
    "services-b2",          # Backblaze B2 (native API)
    "services-cos",         # Tencent Cloud COS
    "services-obs",         # Huawei Cloud OBS
    "services-oss",         # Alibaba Cloud OSS
    "services-swift",       # OpenStack Swift
    "services-upyun",       # Upyun CDN storage
    # Consumer / enterprise cloud drives
    "services-gdrive",      # Google Drive
    "services-onedrive",    # Microsoft OneDrive
    "services-dropbox",     # Dropbox
    "services-aliyun-drive",# Aliyun Drive (Alibaba)
    "services-yandex-disk", # Yandex Disk
    "services-pcloud",      # pCloud
    "services-koofr",       # Koofr
    "services-seafile",     # Seafile
    # Developer / ML / infra
    "services-github",      # GitHub (code forensics)
    "services-huggingface", # HuggingFace datasets/models
    "services-vercel-artifacts", # Vercel build cache
    "services-vercel-blob", # Vercel Blob
    # Distributed / big data
    "services-alluxio",     # Alluxio data orchestration
    "services-webhdfs",     # WebHDFS REST (no JVM needed)
    "services-lakefs",      # LakeFS data versioning
    "services-dbfs",        # Databricks DBFS
    "services-ghac",        # GitHub Actions Cache (useful in CI forensics)
    # Decentralized
    "services-ipfs",        # IPFS (content-addressed, prost dep is pure Rust)
    "services-ipmfs",       # IPFS Mutable File System
    # In-memory / embedded (useful for testing + pipeline)
    "services-memory",
    "services-dashmap",     # Concurrent in-memory map
    "services-mini-moka",   # Bounded in-memory cache
    "services-moka",        # Full-featured in-memory cache with TTL
    "services-redb",        # Embedded key-value (pure Rust, ACID)
    "services-sled",        # Embedded key-value (pure Rust)
    "services-cacache",     # Content-addressable disk cache
    # Network key-value / databases
    "services-redis",       # Redis
    "services-redis-native-tls", # Redis with TLS (rediss://)
    "services-memcached",   # Memcached
    "services-etcd",        # etcd (gRPC, pure Rust)
    "services-tikv",        # TiKV distributed KV
    "services-mongodb",     # MongoDB (pure Rust driver)
    "services-gridfs",      # MongoDB GridFS
    "services-mysql",       # MySQL / MariaDB (sqlx, pure Rust)
    "services-postgresql",  # PostgreSQL (sqlx, pure Rust)
    "services-sqlite",      # SQLite (sqlx, pure Rust)
    # "services-surrealdb" — excluded: pulls async-graphql@7.2.1 which requires rustc 1.89
    "services-persy",       # Persy embedded (pure Rust)
    # Misc
    "services-cloudflare-kv",   # Cloudflare KV (via REST)
    "services-d1",          # Cloudflare D1 SQLite (via REST)
    # Filesystem
    "services-fs",
    "services-http",
    "services-webdav",
        # services-sftp intentionally omitted: openssh Rust crate is Unix-only.
    # SFTP is handled via ssh2 (libssh2 vendored, cross-platform) in src/remote/sftp.rs.
    # services-ftp intentionally omitted: async-tls/tokio-rustls conflict.
    # FTP/FTPS is handled via suppaftp (blocking + rustls) instead.
    "services-hdfs-native", # HDFS pure-Rust native client (no Java/libhdfs required)
    "services-compfs",  # compio-based async filesystem
    # services-monoiofs intentionally omitted from main features: monoio requires Linux io_uring.
    # Added via [target.'cfg(target_os = "linux")'.dependencies] below.
    "blocking",
] }

# FTP/FTPS: blocking suppaftp with rustls (avoids opendal services-ftp async-tls conflict)
suppaftp = { version = "6", default-features = false, features = ["rustls"], optional = true }
# SFTP: cross-platform ssh2 (libssh2 vendored — no openssh Rust crate, no Unix-only deps)
ssh2 = { version = "0.9", features = ["vendored-openssl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# monoiofs depends on monoio (io_uring) which only compiles on Linux
opendal = { version = "0.55.0", features = ["services-monoiofs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }

[features]
default = ["forensic-image", "gpu", "sqlite", "parquet-output", "duckdb-output", "pq", "qr", "archive", "remote"]
forensic-image = ["dep:ewf"]
gpu = ["dep:wgpu", "dep:pollster", "dep:toml", "dep:dirs"]
sqlite = ["dep:rusqlite"]
hashdb = ["dep:bloomfilter", "sqlite"]
yara    = ["dep:yara-x"]
nomicon = ["dep:forensicnomicon"]
report  = ["dep:minijinja"]
parquet-output = ["dep:parquet", "dep:arrow"]
docker  = ["dep:oci-distribution", "dep:flate2", "dep:tar", "dep:tokio"]
archive = ["dep:zip", "dep:flate2", "dep:tar"]
duckdb-output = ["dep:duckdb"]
tui = ["dep:ratatui", "dep:crossterm"]
ots = []
pq  = []
qr  = ["dep:qrcode", "dep:image"]
remote = ["dep:opendal", "dep:tokio", "dep:suppaftp", "dep:ssh2"]
rocksdb-storage = ["remote", "opendal/services-rocksdb"]

[package.metadata.deb]
maintainer = "SecurityRonin <security-ronin@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = """\
blazehash is a forensic file hasher and drop-in superset of hashdeep. \
It defaults to BLAKE3 for speed, supports 8 hash algorithms \
(BLAKE3, SHA-256, SHA-512, SHA3-256, SHA-1, MD5, Tiger, Whirlpool), \
and provides multithreaded parallel hashing with memory-mapped I/O. \
Features include audit mode, piecewise hashing, resume support, \
and CSV/JSON/JSONL output formats."""
assets = [
    ["target/release/blazehash", "usr/bin/", "755"],
]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
zip = "2"

