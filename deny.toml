[graph]
targets = []
# The `remote` feature (opendal cloud/object-storage stack) is a genuinely-optional
# heavy subsystem — opt-in, NOT default (see Cargo.toml [features]). It drags in a
# vulnerable transitive tree (hickory DNS RUSTSEC-2026-0118/0119, quick-xml
# RUSTSEC-2026-0194/0195, plus sqlx/rustls chains) that no hashing workload
# exercises. Rather than blanket-ignore all of those advisories, we keep opendal
# out of the audited graph entirely: check every OTHER feature, never `remote`.
# `cargo deny check` therefore audits exactly what a default `cargo build` ships.
all-features = false
features = [
    "forensic-image",
    "gpu",
    "sqlite",
    "hashdb",
    "yara",
    "report",
    "parquet-output",
    "docker",
    "archive",
    "duckdb-output",
    "tui",
    "ots",
    "pq",
    "qr",
]

[advisories]
version = 2
ignore = [
    # RUSTSEC-2026-0222 (wasmtime, "Stores can mix up type indices between engines").
    # Reached only through yara-x, which compiles YARA rules to WASM internally;
    # blazehash never executes untrusted WASM itself.
    #
    #   resolved:      wasmtime 25.0.3  <- yara-x 0.9.0
    #   patched:       >=24.0.12,<25 | >=36.0.13,<37 | >=46.0.2,<47 | >=47.0.3
    #   latest yara-x 1.19.0 requires wasmtime ^43.0.2 — not a patched line
    #
    # So no yara-x release resolves to a patched wasmtime, and upgrading yara-x
    # does not clear this. Pinning to issen's wasmtime does not help either: that
    # is 26.0.1, equally outside every patched range.
    # CVSS AV:L/AC:H/PR:H/UI:R — local, high complexity, high privilege, user
    # interaction.
    # REMOVE WHEN: yara-x depends on wasmtime >= 46.0.2 (or >= 47.0.3).
    { id = "RUSTSEC-2026-0222", reason = "wasmtime via yara-x; no yara-x release resolves to a patched wasmtime line (latest 1.19.0 needs ^43.0.2; patched are 24.0.12+/36.0.13+/46.0.2+/47.0.3+)" },
    # paste v1 is unmaintained but is a transitive dep of metal (wgpu-hal, GPU feature).
    # No action available until wgpu updates its metal dependency.
    "RUSTSEC-2024-0436",
    # instant v0.1.13 is unmaintained (author recommends web-time) — an
    # unmaintained-ONLY advisory, not a vulnerability, with no reachable defect in a
    # hashing workload. In the audited graph it is reachable solely via the GPU
    # feature (wgpu 22 -> parking_lot 0.11.2 -> instant); parking_lot is held on the
    # 0.11 line by sled (opendal/remote stack, which is excluded from this audit).
    # No safe upgrade exists (instant is abandoned; parking_lot 0.12 dropped it), and
    # the only removals — a wgpu major bump (rewrites the GPU backend) or updating the
    # excluded opendal/sled remote tree — are out of scope for this change. Remove
    # this ignore when wgpu updates its parking_lot dependency off the 0.11 line.
    "RUSTSEC-2024-0384",
    # bincode v1 is unmaintained (RUSTSEC-2025-0141) but is only used by the optional
    # `nsrl` feature for bloom filter serialization. No drop-in v2 replacement exists
    # for the bloomfilter crate's serde output. Will migrate when bloomfilter updates.
    "RUSTSEC-2025-0141",

    # fxhash unmaintained — transitive dep via yara-x.
    "RUSTSEC-2025-0046",
    # rustls-pemfile unmaintained — transitive dep via yara-x.
    "RUSTSEC-2026-0098",
    # rustls 0.21 cert validation bugs — transitive dep via yara-x.
    "RUSTSEC-2026-0099",
    # RSA Marvin Attack / timing side-channel — transitive via yara-x.
    # No direct key-recovery risk in our hashing workload (we never do RSA decryption).
    "RUSTSEC-2023-0071",
    # tonic advisory — transitive via yara-x.
    "RUSTSEC-2025-0118",

    # rustls-webpki CRL parsing panic — transitive via yara-x.
    # No CRL parsing performed in blazehash; only hash computation paths are used.
    "RUSTSEC-2026-0104",

    # Wasmtime vulnerabilities — all transitive via yara-x → wasmtime.
    # We do not run untrusted Wasm; only YARA rules execute in the Cranelift sandbox.
    # Will resolve when yara-x upgrades its wasmtime dependency.
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    # Used by LLVM/Cranelift toolchain crates (wasmtime) pulled in by yara-x
    "Apache-2.0 WITH LLVM-exception",
    # Used by Substrait/Arrow ecosystem crates pulled in by yara-x
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
