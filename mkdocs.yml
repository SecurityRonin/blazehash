site_name: blazehash
site_url: https://securityronin.github.io/blazehash/
repo_url: https://github.com/SecurityRonin/blazehash
repo_name: SecurityRonin/blazehash
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Acquire Evidence: acquire.md
  - Build Court-Ready Evidence: custody.md
  - Hunt Threats: hunt.md
  - SIEM & Analytics: siem.md
  - Cookbook: cookbook.md
  - Remote Storage: remote.md
  - CLI Reference: cli-reference.md
  - Concepts: concepts.md
  - MCP Server: mcp.md

plugins:
  - search
